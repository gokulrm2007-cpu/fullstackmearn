<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fetch App</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    button { padding: 0.5rem 1rem; background: #38bdf8; border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    #result { margin-top: 1rem; color: #34d399; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Student Data (fech-app.html)</h2>
  <button onclick="loadDATA()">Load Student</button> 
  <p id="result"></p>

  <script>
    async function loadDATA() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
        const data = await response.json();
        console.log("Fetched user data:", data);
        document.getElementById("result").textContent = "Student Name: " + data.name;
      } catch (err) {
        document.getElementById("result").textContent = "Student Name: Leanne Graham (Offline Mock)";
      }
    }
  </script>
</body>
</html>
