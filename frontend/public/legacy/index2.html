<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quick Adder</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    input { padding: 0.5rem; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 4px; width: 80px; }
    button { padding: 0.5rem 1rem; margin-left: 0.5rem; background: #10b981; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
    #result { margin-top: 1rem; color: #34d399; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>
  <h2>DOM Quick Adder (index2.html)</h2>
  <input id="num1" type="number" value="10">
  +
  <input id="num2" type="number" value="20">
  <button onclick="resultFunction()">Add</button>
  <p id="result">Result: 30</p>

  <script>
    var box1 = document.getElementById("num1");
    var box2 = document.getElementById("num2");
    var result = document.getElementById("result");

    function resultFunction() {
      var box1value = Number(box1.value);
      var box2value = Number(box2.value);
      var total = box1value + box2value;
      result.textContent = "Result: " + total;
    }
  </script>
</body>
</html>
