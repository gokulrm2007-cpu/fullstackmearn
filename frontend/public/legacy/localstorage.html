<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LocalStorage Demo</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    input { padding: 0.5rem; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 4px; }
    button { padding: 0.5rem 1rem; margin-left: 0.5rem; background: #818cf8; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
    #result { margin-top: 1rem; color: #38bdf8; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>LocalStorage Demo (localstorage.html)</h2>
  <input type="text" id="studentName" placeholder="Enter student name">
  <button onclick="saveData()">Save</button>
  <button onclick="getData()">Get Data</button>

  <p id="result"></p>

  <script>
    function saveData() {
      let name = document.getElementById("studentName").value;
      localStorage.setItem("student", name);
      alert("Data Saved");
    }

    function getData() {
      let student = localStorage.getItem("student");
      document.getElementById("result").innerHTML = "Stored Student: " + (student || "None");
    }
  </script>
</body>
</html>
